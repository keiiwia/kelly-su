    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../project-pages.css">

<body class="project-page">
    <header class="top-nav" role="banner">
        <a href="../index.html" class="top-nav-brand" aria-label="Kelly Su home">
            <span class="top-nav-name">Kelly Su</span>
            <img src="../images/favicon.jpg" alt="" class="top-nav-logo">

        <nav class="top-nav-links" aria-label="Main">
            <a href="../index.html#work">work</a>
            <a href="../playground.html">playground</a>
            <a href="../about.html">about</a>
        </nav>
    </header>

    <div class="project-layout">

        <aside class="project-toc" aria-label="Table of contents">
            <a href="../index.html" class="project-toc-home">← home</a>
        </aside>

        <main class="project-main" id="projectMain">

            <!-- Password gate — visible until the correct password is entered -->
            <div class="protected-gate" id="protectedGate">
                <p class="protected-gate-label">Protected</p>
                <h1 class="protected-gate-heading">This project is private.</h1>
                <p class="protected-gate-sub">Enter the password to view.</p>
                <form class="protected-gate-form" id="gateForm" autocomplete="off">
                    <input
                        class="protected-gate-input"
                        id="gateInput"
                        type="password"
                        placeholder="Password"
                        aria-label="Project password"
                        autocomplete="new-password"
                    >
                    <button class="protected-gate-btn" type="submit">Unlock</button>
                </form>
                <p class="protected-gate-error" id="gateError" hidden aria-live="polite">
                    Incorrect password.
                </p>
            </div>

            <!--
                Encrypted content blob — generated by encrypt-util.html.
                Contains: salt (PBKDF2), iv (AES-GCM), ciphertext (base64).
                None of these values reveal the password or the plaintext.
            -->
            <script id="encryptedPayload" type="application/json">
                PASTE_ENCRYPTED_BLOB_HERE
            </script>

        </main>

    </div>

    <footer class="site-footer">
        <p class="footer-credit">Designed and coded by Kelly Su.</p>
        <nav class="footer-links" aria-label="Footer">
            <a href="https://www.linkedin.com/in/kelly-x-su" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:kellysu@newschool.edu">Email</a>
            <a href="https://github.com/keiiwia/" target="_blank" rel="noopener noreferrer">Github</a>
            <a href="https://keiiwia.substack.com/" target="_blank" rel="noopener noreferrer">Substack</a>
        </nav>
    </footer>

    <script>
    (function () {
        const gate  = document.getElementById('protectedGate');
        const form  = document.getElementById('gateForm');
        const input = document.getElementById('gateInput');
        const err   = document.getElementById('gateError');

        // Parse the encrypted blob embedded in the page
        let payload;
        try {
            payload = JSON.parse(document.getElementById('encryptedPayload').textContent.trim());
        } catch {
            err.textContent = 'Encrypted content missing or malformed.';
            err.hidden = false;
            form.hidden = true;
            return;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            err.hidden = true;
            input.classList.remove('is-error');

            const password = input.value;
            if (!password) return;

            try {
                const salt       = b64ToBuffer(payload.salt);
                const iv         = b64ToBuffer(payload.iv);
                const ciphertext = b64ToBuffer(payload.ciphertext);

                // Derive a 256-bit AES-GCM key from the password using PBKDF2.
                // 100 000 iterations makes brute-force expensive.
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    new TextEncoder().encode(password),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                // AES-GCM is authenticated: a wrong password causes the auth-tag
                // check to fail and throws — no partial plaintext ever leaks.
                const plaintext = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    ciphertext
                );

                const html = new TextDecoder().decode(plaintext);

                // Swap gate out and inject the decrypted project content
                const main = document.getElementById('projectMain');
                main.innerHTML = html;

                // Re-run any inline scripts that were in the decrypted content
                main.querySelectorAll('script').forEach(old => {
                    const s = document.createElement('script');
                    if (old.src) s.src = old.src;
                    else s.textContent = old.textContent;
                    old.replaceWith(s);
                });

            } catch {
                // Wrong password or tampered ciphertext — show error, no info leaked
                err.hidden = false;
                input.classList.add('is-error');
                input.value = '';
                input.focus();
            }
        });

        function b64ToBuffer(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }
    })();
    </script>
</body>
</html>
