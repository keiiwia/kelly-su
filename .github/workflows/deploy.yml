name: Deploy site

# Builds the Astro site and serves the archived vanilla-JS site (tag v1-vanilla) at /v1/.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check out v1 archive
        uses: actions/checkout@v7
        with:
          ref: v1-vanilla
          path: v1-src

      - name: Add v1 archive at /v1/
        run: |
          rsync -a \
            --exclude .git --exclude .gitignore --exclude .vscode \
            --exclude .DS_Store --exclude CNAME --exclude README.md \
            v1-src/ dist/v1/
          du -sh dist dist/v1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
