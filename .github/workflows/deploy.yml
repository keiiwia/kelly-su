name: Deploy site

# Publishes the site with GitHub Actions (Settings → Pages → Source: "GitHub Actions").
# Before launch, the vanilla-JS site (tag v1-vanilla) is the whole site, so every existing link keeps working.
# After launch, the Astro site is the home page and the vanilla site is archived at /v1/.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set to "true" when the Astro redesign is ready to replace the vanilla site.
  LAUNCH_ASTRO: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build # runs before launch too, so build errors show up early

      - name: Check out the vanilla site
        uses: actions/checkout@v7
        with:
          ref: v1-vanilla
          path: v1-src

      - name: Add the vanilla site
        run: |
          if [ "$LAUNCH_ASTRO" = "true" ]; then
            dest=dist/v1/              # launched: archive at /v1/
          else
            rm -rf dist && mkdir dist  # not launched yet: the vanilla site is the whole site
            dest=dist/
          fi
          rsync -a \
            --exclude .git --exclude .gitignore --exclude .vscode \
            --exclude .DS_Store --exclude CNAME --exclude README.md \
            v1-src/ "$dest"
          du -sh dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
